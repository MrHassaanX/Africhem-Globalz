<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Africhem review panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#102a36;font:16px/1.5 Arial,sans-serif}header{background:#092330;color:#fff;padding:20px max(24px,calc((100vw - 1080px)/2))}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#b5cbd0}main{max-width:1080px;margin:28px auto;padding:0 24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.toolbar button{background:#d9e6e7;color:#102a36}.toolbar button[aria-pressed=true]{background:#007c86;color:white}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #b9c9ce;background:#fff;color:#102a36}input[type=search]{max-width:370px}button{padding:10px 16px;border:0;background:#007c86;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.item{display:grid;grid-template-columns:180px 1fr;gap:18px;background:#fff;border:1px solid #d5dfe1;padding:16px;margin:0 0 14px}.item img{width:100%;aspect-ratio:1.5;object-fit:cover;background:#d8e3e4}.item h2{font-size:18px;margin:0 0 10px}.fields{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:13px;font-weight:700;display:grid;gap:4px}.row label{flex:1;min-width:220px}.upload{padding:8px;background:#e9f1f2;color:#17353e;cursor:pointer}.upload input{max-width:220px;border:0;padding:0;background:transparent}small{color:#526a72}#status{font-weight:700;min-height:1.5em}@media(max-width:620px){.item{grid-template-columns:1fr}.item img{max-width:300px}}
</style></head><body><header><h1>Africhem review panel</h1><p>Local editing tool · saved changes appear in Git for review</p></header><main><nav class="toolbar" aria-label="Editor sections"><button id="images-tab" aria-pressed="true">Page images</button><button id="products-tab" aria-pressed="false">Product cards</button><input id="search" type="search" placeholder="Find an image or product" aria-label="Find an image or product"><span id="status" role="status"></span></nav><div id="items"></div></main>
<script>
const token='__PANEL_TOKEN__',items=document.querySelector('#items'),status=document.querySelector('#status');let products=[],images=[],mode='images';
async function load(){const [a,b]=await Promise.all([fetch('/api/products'),fetch('/api/images')]);products=(await a.json()).products;images=(await b.json()).images;render()}
function element(tag,props={}){const node=document.createElement(tag);for(const [key,value] of Object.entries(props)){if(key==='text')node.textContent=value;else node[key]=value}return node}
function render(){items.replaceChildren();document.querySelector('#images-tab').setAttribute('aria-pressed',mode==='images');document.querySelector('#products-tab').setAttribute('aria-pressed',mode==='products');const query=document.querySelector('#search').value.toLowerCase();const entries=mode==='images'?images:products;for(const entry of entries.filter(item=>(item.label??item.name).toLowerCase().includes(query))){const card=element('article',{className:'item'}),picture=element('img',{src:'/image'+entry.image,alt:''}),fields=element('div',{className:'fields'}),title=element('h2',{text:entry.label??entry.name}),path=element('input',{value:entry.image}),imageLabel=element('label',{text:'Image path'}),row=element('div',{className:'row'}),uploadLabel=element('label',{className:'upload',text:'Upload image'}),upload=element('input',{type:'file',accept:'image/png,image/jpeg,image/webp'}),save=element('button',{text:'Save changes'}),note=element('small',{text:'Save, then refresh the website preview. Commit the changed JSON and uploaded image.'});imageLabel.append(path);uploadLabel.append(upload);row.append(imageLabel,uploadLabel,save);fields.append(title);let desc;if(mode==='products'){desc=element('textarea',{value:entry.description,rows:2});fields.append(desc)}else{const link=element('a',{href:'http://127.0.0.1:3181'+entry.page,target:'_blank',rel:'noopener',text:'View page ↗'});fields.append(link)}fields.append(row,note);card.append(picture,fields);items.append(card);
path.addEventListener('change',()=>{picture.src='/image'+path.value});upload.addEventListener('change',async()=>{const file=upload.files[0];if(!file)return;status.textContent='Uploading…';try{const response=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':file.type,'x-panel-token':token},body:file});const data=await response.json();if(!response.ok)throw Error(data.error);path.value=data.image;picture.src='/image'+data.image;status.textContent='Image uploaded. Save changes to use it.'}catch(error){status.textContent=error.message}});
save.addEventListener('click',async()=>{save.disabled=true;status.textContent='Saving…';try{const isImage=mode==='images';const response=await fetch(isImage?'/api/images':'/api/products',{method:'POST',headers:{'Content-Type':'application/json','x-panel-token':token},body:JSON.stringify(isImage?{key:entry.key,image:path.value}:{name:entry.name,description:desc.value,image:path.value})});const data=await response.json();if(!response.ok)throw Error(data.error);entry.image=path.value;if(desc)entry.description=desc.value;status.textContent=(entry.label??entry.name)+' saved. Refresh the website preview.'}catch(error){status.textContent=error.message}finally{save.disabled=false}})}}
document.querySelector('#search').addEventListener('input',render);for(const section of ['images','products'])document.querySelector('#'+section+'-tab').addEventListener('click',()=>{mode=section;render()});load().catch(error=>status.textContent=error.message);
</script></body></html>
